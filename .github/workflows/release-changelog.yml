name: Tag Release in Changelog

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'

jobs:
  tag-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp Release Version in CHANGELOG.md
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION=$(echo "$TAG" | sed 's/^v//')
          DATE=$(date -u +%Y-%m-%d)
          
          echo "Cutting Release: [$VERSION] - $DATE"
          
          python3 -c "
          import re
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()

          version = '$VERSION'
          date = '$DATE'
          
          target = '## [Unreleased]'
          replacement = f'## [Unreleased]\n\n## [{version}] - {date}'
          
          if target in content:
              # Only replace the first occurrence
              updated = content.replace(target, replacement, 1)
              with open('CHANGELOG.md', 'w', encoding='utf-8') as f:
                  f.write(updated)
              print(f'Successfully stamped [{version}] - {date} in CHANGELOG.md')
          else:
              print('Warning: ## [Unreleased] header not found in CHANGELOG.md')
          "

      - name: Commit and Push Release Changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(release): stamp version ${{ github.event.release.tag_name || github.ref_name }} in CHANGELOG.md [skip ci]"
          file_pattern: "CHANGELOG.md"
          branch: ${{ github.event.repository.default_branch }}
