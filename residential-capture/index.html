<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>Capture holdings</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --accent:#38bdf8; --ok:#4ade80; --border:#334155; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); padding:1rem 1rem 4rem; }
    h1 { font-size:1.5rem; margin:0 0 .35rem; }
    p { color:var(--muted); margin:0 0 1rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.1rem; margin-bottom:1rem; }
    button { width:100%; font:inherit; font-weight:700; font-size:1.1rem; border:none; border-radius:12px; padding:1rem; margin-top:.6rem; cursor:pointer; }
    .primary { background:var(--ok); color:#052e16; }
    .secondary { background:#334155; color:var(--text); font-size:.95rem; padding:.75rem; }
    input { width:100%; font:inherit; padding:.7rem; border-radius:8px; border:1px solid var(--border); background:#0b1220; color:var(--text); margin-top:.35rem; }
    label { font-size:.85rem; color:var(--muted); }
    .status { min-height:1.2rem; font-size:.9rem; margin-top:.5rem; }
    .ok { color:var(--ok); }
    .err { color:#f87171; }
    .hidden { display:none; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <h1>Capture holdings</h1>
  <p>One tap on Navi → cloud agent gets the files.</p>

  <div id="setup" class="card hidden">
    <label>Upload server URL</label>
    <input id="uploadUrl" placeholder="https://fund-holdings-residential-capture….workers.dev" />
    <label style="margin-top:.75rem;display:block">PIN (4 digits)</label>
    <input id="pin" inputmode="numeric" maxlength="8" placeholder="e.g. 4829" />
    <button type="button" class="primary" id="saveSetup">Save & continue</button>
  </div>

  <div id="main" class="hidden">
    <div class="card" id="onNavi">
      <button type="button" class="primary" id="captureNow">Capture &amp; publish Navi</button>
      <div class="status" id="status"></div>
    </div>

    <div class="card" id="offNavi">
      <p style="margin:0">1. Open <a href="https://navi.com/mutual-fund/downloads/portfolio">Navi portfolio</a><br>
      2. Tap your <strong>Navi capture</strong> bookmark once</p>
      <button type="button" class="secondary" id="installBookmark">Install bookmark (one-time)</button>
    </div>

    <button type="button" class="secondary" id="changePin">Change PIN / server</button>
  </div>

  <script>
    const DEFAULT_UPLOAD = "";

    const $ = (id) => document.getElementById(id);
    const cfg = () => ({
      uploadUrl: localStorage.getItem("rh_upload") || DEFAULT_UPLOAD,
      pin: localStorage.getItem("rh_pin") || "",
    });

    function setStatus(msg, ok) {
      const el = $("status");
      el.textContent = msg;
      el.className = "status " + (ok ? "ok" : "err");
    }

    function monthPeriod() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }

    function fortnightValue() {
      const d = new Date();
      const names = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      const m = names[d.getMonth()];
      const end = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      return d.getDate() <= 18 ? m + " 1-15" : m + " 16-" + end;
    }

    function fy(y, mo) { return mo >= 4 ? y + "-" + (y + 1) : (y - 1) + "-" + y; }

    function nonce() {
      const h = document.documentElement.innerHTML;
      return h.match(/"nonce"\s*:\s*"([a-f0-9]+)"/i)?.[1] || h.match(/wp-nonce["']?\s*[:=]\s*["']([a-f0-9]+)/i)?.[1] || "";
    }

    async function captureNavi() {
      const n = nonce();
      if (!n) throw new Error("Not on Navi portfolio page");
      const period = monthPeriod();
      const [y, mo] = period.split("-").map(Number);
      const val = fortnightValue();
      const r = await fetch("https://navi.com/wp-json/nv/v1/documents", {
        method: "POST",
        credentials: "include",
        headers: {
          "content-type": "application/x-www-form-urlencoded; charset=UTF-8",
          "wp-nonce": n,
          "x-requested-with": "XMLHttpRequest",
        },
        body: new URLSearchParams({
          financial_year: fy(y, mo),
          value: val,
          category: "885",
          type: "Fortnightly",
          order: "DESC",
        }),
      });
      const j = await r.json();
      if (!j.success) throw new Error("Navi API: " + JSON.stringify(j).slice(0, 120));
      const files = [];
      for (const row of j.data || []) {
        const urls = Array.isArray(row.url) ? row.url : row.url ? [row.url] : [];
        for (const u of urls) {
          if (!u) continue;
          files.push({
            title: row.title || "",
            download_url: String(u).replace(/\\\//g, "/"),
            saved_as: decodeURIComponent(String(u).split("/").pop()),
          });
        }
      }
      if (!files.length) throw new Error("No files in API response");
      return {
        amc_id: "navi-mutual-fund",
        period,
        cadence: "fortnightly",
        captured_at: new Date().toISOString(),
        captured_from: "one-tap",
        files,
      };
    }

    async function publish(manifest) {
      const { uploadUrl, pin } = cfg();
      if (!pin) throw new Error("Set PIN first (Change PIN button)");
      const r = await fetch(uploadUrl.replace(/\/$/, "") + "/publish", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin, manifest }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) throw new Error(data.error || "Upload failed");
      return data;
    }

    async function runCapture(btn) {
      btn.disabled = true;
      setStatus("Capturing…", true);
      try {
        const manifest = await captureNavi();
        setStatus("Uploading " + manifest.files.length + " files…", true);
        const res = await publish(manifest);
        setStatus("Done — " + manifest.files.length + " files published", true);
        return res;
      } catch (e) {
        setStatus(e.message || String(e), false);
        throw e;
      } finally {
        btn.disabled = false;
      }
    }

    function bookmarkletCode(uploadUrl, pin) {
      const u = uploadUrl.replace(/\/$/, "");
      const p = pin.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
      return `javascript:(async()=>{try{const h=document.documentElement.innerHTML;const n=h.match(/"nonce"\\s*:\\s*"([a-f0-9]+)"/i)?.[1];if(!n){alert('Open Navi portfolio page first');return}const d=new Date();const per=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const names=['January','February','March','April','May','June','July','August','September','October','November','December'];const m=names[d.getMonth()];const end=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();const val=d.getDate()<=18?m+' 1-15':m+' 16-'+end;const y=d.getFullYear(),mo=d.getMonth()+1;const fy=mo>=4?y+'-'+(y+1):(y-1)+'-'+y;const r=await fetch('https://navi.com/wp-json/nv/v1/documents',{method:'POST',credentials:'include',headers:{'content-type':'application/x-www-form-urlencoded; charset=UTF-8','wp-nonce':n,'x-requested-with':'XMLHttpRequest'},body:new URLSearchParams({financial_year:fy,value:val,category:'885',type:'Fortnightly',order:'DESC'})});const j=await r.json();if(!j.success){alert('API failed');return}const files=[];for(const row of j.data||[]){const urls=Array.isArray(row.url)?row.url:(row.url?[row.url]:[]);for(const u of urls){if(!u)continue;files.push({title:row.title||'',download_url:u,saved_as:decodeURIComponent(u.split('/').pop())})}}const manifest={amc_id:'navi-mutual-fund',period:per,cadence:'fortnightly',captured_at:new Date().toISOString(),files};const up=await fetch('${u}/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:'${p}',manifest})});const out=await up.json();alert(out.ok?'Published '+files.length+' files':'Failed: '+(out.error||up.status))}catch(e){alert(e)}})();`;
    }

    function showScreen() {
      const { pin } = cfg();
      if (!pin) {
        $("setup").classList.remove("hidden");
        $("main").classList.add("hidden");
        $("uploadUrl").value = cfg().uploadUrl;
        return;
      }
      $("setup").classList.add("hidden");
      $("main").classList.remove("hidden");
      const onNavi = /navi\.com$/i.test(location.hostname);
      $("onNavi").classList.toggle("hidden", !onNavi);
      $("offNavi").classList.toggle("hidden", onNavi);
    }

    $("saveSetup").onclick = () => {
      const url = $("uploadUrl").value.trim() || DEFAULT_UPLOAD;
      const pin = $("pin").value.trim();
      if (pin.length < 4) { alert("PIN at least 4 digits"); return; }
      localStorage.setItem("rh_upload", url);
      localStorage.setItem("rh_pin", pin);
      showScreen();
    };

    $("captureNow").onclick = () => runCapture($("captureNow"));

    $("installBookmark").onclick = async () => {
      const { uploadUrl, pin } = cfg();
      const code = bookmarkletCode(uploadUrl, pin);
      try {
        await navigator.clipboard.writeText(code);
        alert("Copied! Add a bookmark, paste this as the URL, name it Navi capture.");
      } catch {
        prompt("Copy bookmark URL:", code);
      }
    };

    $("changePin").onclick = () => {
      $("setup").classList.remove("hidden");
      $("uploadUrl").value = cfg().uploadUrl;
      $("pin").value = cfg().pin;
    };

    showScreen();
  </script>
</body>
</html>
